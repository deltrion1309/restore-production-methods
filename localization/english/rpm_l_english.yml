l_english:

 # Post-war summary event
 rpm_events.1.t:0 "The Cost of Rebellion"
 rpm_events.1.d:0 "Our officials have finished their survey of the states recovered from the rebels. While the territory was out of our hands, its industry was reorganised to suit the insurgents' priorities rather than our own.\n\nAcross #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_states').GetValue|0]#! recovered states, #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_pm_changes').GetValue|0]#! production methods were changed in #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_pm_buildings').GetValue|0]#! buildings.\n\n#variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_buildings_expanded').GetValue|0]#! buildings were expanded by a total of #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_levels_added').GetValue|0]#! levels, #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_buildings_reduced').GetValue|0]#! were reduced, and #variable [ROOT.GetCountry.MakeScope.Var('rpm_sum_buildings_new').GetValue|0]#! were raised where nothing stood before."
 rpm_events.1.f:0 "The ledgers do not lie, even when the rebels did."
 rpm_events.1.a:0 "Note it and move on."
